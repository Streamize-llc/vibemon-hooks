name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Verify VERSION matches tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="v$(cat VERSION | tr -d '[:space:]')"
          if [ "$TAG" != "$VER" ]; then
            echo "Tag ($TAG) does not match VERSION file ($VER)"
            exit 1
          fi

      - name: Build
        run: python3 scripts/build.py

      - name: Verify reproducibility
        run: python3 scripts/build.py --check

      - name: Run all tests
        run: python3 -m pytest tests/ -v

      - name: Compute release artifacts
        run: |
          mkdir -p release
          cp dist/install.sh        release/install.sh
          cp dist/install.sh.sha256 release/install.sh.sha256
          cp dist/install.ps1       release/install.ps1
          cp dist/install.ps1.sha256 release/install.ps1.sha256
          # Also compute sha256 inline for double-check (both artifacts)
          sha256sum dist/install.sh dist/install.ps1 > release/sha256sum.txt
          cat release/sha256sum.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/install.sh
            release/install.sh.sha256
            release/install.ps1
            release/install.ps1.sha256
            release/sha256sum.txt
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Windows GUI installer (Phase 2) — embedded CPython + Inno Setup.
  # The silent-install smoke is the real E2E: it executes the built exe
  # under a throwaway profile, which runs install.py on the bundled
  # interpreter and merges hooks for real.
  installer-windows:
    runs-on: windows-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - name: Build VibeMonSetup.exe
        shell: pwsh
        run: ./installer/windows/build.ps1 -OutDir dist-installer

      - name: Smoke — silent install under a throwaway profile
        shell: pwsh
        run: |
          $fakeHome = Join-Path $env:RUNNER_TEMP "vbm_smoke_home"
          New-Item -ItemType Directory -Force -Path $fakeHome | Out-Null
          $env:USERPROFILE = $fakeHome
          $p = Start-Process -FilePath "dist-installer\VibeMonSetup.exe" `
                -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/APIKEY=vbm_ci_smoke_key" `
                -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup exited $($p.ExitCode)" }
          $vd = Join-Path $fakeHome ".vibemon"
          foreach ($f in @("notify.py","install.py","paths.py","merge_mcp.py","python\python.exe","api-key","version")) {
            if (-not (Test-Path (Join-Path $vd $f))) { throw "missing after install: $f" }
          }
          # Bundled interpreter must import the runtime (._pth carries "..")
          & (Join-Path $vd "python\python.exe") -c "import notify, install, paths, extract, classify; import sys; print('imports OK on', sys.version)"
          if ($LASTEXITCODE -ne 0) { throw "bundled python import smoke failed" }
          # Hooks merged with the bundled interpreter baked in
          $settings = Get-Content (Join-Path $fakeHome ".claude\settings.json") -Raw
          if ($settings -notmatch "python") { throw "claude hooks missing bundled python launcher" }
          if ($settings -notmatch "notify.py") { throw "claude hooks missing notify.py" }
          Write-Host "silent-install E2E smoke OK (v$(Get-Content (Join-Path $vd 'version')))"

      - name: Attach installer to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-installer/VibeMonSetup.exe
            dist-installer/VibeMonSetup.exe.sha256
          fail_on_unmatched_files: true

  # NOTE: a macOS GUI installer (installer/macos, .dmg) shipped in v24 and
  # was retired the same day — macOS users of AI coding agents are
  # terminal-capable, and the unsigned-.app Gatekeeper dance on macOS 15+
  # is worse UX than the one-liner. Resurrect from the v24/v25 tags if a
  # signed build ever becomes worth it.
